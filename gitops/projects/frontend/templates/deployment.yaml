apiVersion: apps/v1
kind: Deployment
metadata:
  name: sentinel-frontend
  namespace: sentinel
  labels:
    app.kubernetes.io/name: sentinel-frontend
    app.kubernetes.io/part-of: sentinel
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: sentinel-frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sentinel-frontend
        app.kubernetes.io/part-of: sentinel
    spec:
      containers:
        - name: frontend
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          env:
            - name: NODE_ENV
              value: "production"
            {{- if .Values.wsUrl }}
            - name: NEXT_PUBLIC_WS_URL
              value: {{ .Values.wsUrl | quote }}
            {{- end }}
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: sentinel-frontend
  namespace: sentinel
  labels:
    app.kubernetes.io/name: sentinel-frontend
    app.kubernetes.io/part-of: sentinel
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.targetPort }}
      protocol: TCP
      name: http
  selector:
    app.kubernetes.io/name: sentinel-frontend
{{- if .Values.ingress.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: sentinel-frontend
  namespace: sentinel
  labels:
    app.kubernetes.io/name: sentinel-frontend
    app.kubernetes.io/part-of: sentinel
spec:
  ingressClassName: {{ .Values.ingress.className }}
  rules:
    - host: {{ .Values.ingress.hostname }}
      http:
        paths:
          - path: {{ .Values.ingress.path }}
            pathType: Prefix
            backend:
              service:
                name: sentinel-frontend
                port:
                  number: {{ .Values.service.port }}
{{- end }}
