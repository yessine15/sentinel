# =============================================================
# demo-api Helm values (local dev / kind)
#
# These are defaults for the local kind cluster. values-prod.yaml will
# override image registries, replicas, and resource limits for cloud.
# =============================================================

# Number of replicas. For local dev 1 is enough.
replicaCount: 1

image:
  repository: ghcr.io/yessine15/sentinel-demo-api
  tag: "v0.2.0"
  pullPolicy: IfNotPresent

# Resources for local dev — keep tiny.
resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 250m
    memory: 128Mi

# Service — exposed inside the cluster on port 80 -> container 8000.
service:
  type: ClusterIP
  port: 80
  targetPort: 8000

# Ingress — the demo app is the root `sentinel.local` host.
ingress:
  enabled: true
  className: nginx
  hostname: sentinel.local
  path: /
  tls:
    enabled: false

# OTel exporter endpoint — OTLP HTTP to the collector.
otel:
  exporterEndpoint: http://otel-collector-opentelemetry-collector.observability.svc:4318

# Environment variables for services the API needs at runtime.
# Uses k8s internal DNS so the container works regardless of ingress health.
env:
  - name: LLM_BASE_URL
    value: "http://litellm.litellm.svc:4000/v1"
  - name: LLM_MODEL
    value: "gemma4"
  - name: QDRANT_URL
    value: "http://qdrant.qdrant.svc:6333"
  - name: OLLAMA_BASE_URL
    value: "http://172.18.0.1:11434"
  - name: PROMETHEUS_URL
    value: "http://kube-prometheus-stack-prometheus.observability.svc:9090"
  - name: LOKI_URL
    value: "http://loki.observability.svc:3100"
  - name: RUN_MODE
    value: "live"

# Probes — standard FastAPI health endpoints.
probes:
  liveness:
    httpGet:
      path: /healthz
      port: 8000
    initialDelaySeconds: 5
  readiness:
    httpGet:
      path: /readyz
      port: 8000
    initialDelaySeconds: 5
