{{- if .Values.ingress.enabled -}}
# =============================================================
# Ingress: llm.local → litellm Service
#
# Routes external HTTP traffic to the LiteLLM proxy.
# Ingress controller (ingress-nginx) terminates TLS if
# configured; this Ingress uses plain HTTP on port 80.
#
# Host: llm.local (must be in /etc/hosts → 127.0.0.1)
# =============================================================
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: litellm
  labels:
    app.kubernetes.io/name: litellm
    app.kubernetes.io/part-of: sentinel
spec:
  ingressClassName: {{ .Values.ingress.className }}
  rules:
    - host: {{ .Values.ingress.host }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: litellm
                port:
                  number: 4000
{{- end }}
