# Minimal RemediationPlan CRD (T3.7).
#
# Installed now so the Executor Agent can create RemediationPlan
# objects in the cluster (T3.7 "done when").  T3.8 regenerates this
# from the Go types via `make manifests` in the Kubebuilder operator —
# the schema below is intentionally aligned with the Go structs we
# will define there (api/sentinel.io/v1).
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: remediationplans.sentinel.io
spec:
  group: sentinel.io
  names:
    kind: RemediationPlan
    listKind: RemediationPlanList
    plural: remediationplans
    singular: remediationplan
    shortNames:
      - rp
  scope: Namespaced
  versions:
    - name: v1
      served: true
      storage: true
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                incident:
                  type: string
                priority:
                  type: string
                rationale:
                  type: string
                dryRun:
                  type: boolean
                approvedBy:
                  type: string
                planRef:
                  type: string
                steps:
                  type: array
                  items:
                    type: object
                    properties:
                      action:
                        type: string
                      target:
                        type: string
                      detail:
                        type: string
            status:
              type: object
              properties:
                state:
                  type: string
                message:
                  type: string
                observedGeneration:
                  type: integer
