# =============================================================
# Promtail Helm values for Sentinel (local kind)
#
# Promtail is a log-shipping agent. It runs as a DaemonSet (one pod
# per node), reads container log files from the host, adds useful
# Kubernetes labels (pod name, namespace, container name), and
# forwards every line to Loki.
#
# Without Promtail, Loki has no logs to store — it can't pull them
# from the containers on its own. Promtail is the "push" side of
# the log pipeline.
# =============================================================

config:
  # Which log files to watch (the standard Kubernetes container log
  # directory on every node).
  clients:
    - url: http://loki.observability:3100/loki/api/v1/push
      external_labels:
        cluster: sentinel

  # Standard Kubernetes log scraping. This watches /var/log/pods on
  # every node, adds pod/namespace/container metadata from the file
  # path, and tails them to Loki.
  snippets:
    scrapeConfigs: |
      - job_name: kubernetes-pods
        pipeline_stages:
          - docker: {}
          - cri: {}
        kubernetes_sd_configs:
            - role: pod
        relabel_configs:
          - source_labels:
              - __meta_kubernetes_pod_controller_name
            regex: ([0-9a-z-.]+?)(-[0-9a-f]{8,10})?
            action: replace
            target_label: __tmp_controller_name
          - source_labels:
              - __meta_kubernetes_pod_label_app_kubernetes_io_name
              - __meta_kubernetes_pod_label_app
              - __tmp_controller_name
              - __meta_kubernetes_pod_name
            regex: ^;*([^;]+)(;.*)?$
            action: replace
            target_label: app
          - source_labels:
              - __meta_kubernetes_pod_label_app_kubernetes_io_instance
              - __meta_kubernetes_pod_label_app_kubernetes_io_name
              - __meta_kubernetes_pod_label_app
            regex: ^;*([^;]+)(;.*)?$
            action: replace
            target_label: instance
          - source_labels:
              - __meta_kubernetes_namespace
            action: replace
            target_label: namespace
          - source_labels:
              - __meta_kubernetes_pod_name
            action: replace
            target_label: pod
          - source_labels:
              - __meta_kubernetes_pod_container_name
            action: replace
            target_label: container
          - replacement: /var/log/pods/*$1/*.log
            separator: /
            source_labels:
              - __meta_kubernetes_pod_uid
              - __meta_kubernetes_pod_container_name
            target_label: __path__

# Resources — keep modest for local dev.
resources:
  requests:
    cpu: 20m
    memory: 64Mi
  limits:
    cpu: 200m
    memory: 128Mi

# Tolerate the control-plane taint so Promtail runs on ALL nodes,
# including the control-plane where etcd/apiserver logs live.
tolerations:
  - operator: Exists

# Disable the service (Promtail doesn't serve any HTTP API we need).
service:
  enabled: false
