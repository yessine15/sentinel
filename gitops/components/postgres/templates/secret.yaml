# =============================================================
# Secret: Postgres credentials (local dev only)
#
# Phase 4 (T4.8) will replace this with External Secrets Operator
# + Vault, so no real secret is ever committed to git. For Phase 1
# the values are trivial dev defaults.
# =============================================================
apiVersion: v1
kind: Secret
metadata:
  name: postgres-creds
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/part-of: sentinel
type: Opaque
stringData:
  POSTGRES_PASSWORD: {{ .Values.auth.postgresPassword | quote }}
  POSTGRES_DB: {{ .Values.auth.database | quote }}
  POSTGRES_USER: {{ .Values.auth.username | quote }}
  PGPASSWORD: {{ .Values.auth.password | quote }}
