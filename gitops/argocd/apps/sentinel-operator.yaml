# =============================================================
# ArgoCD Application: sentinel-operator
#
# Discovered by the root Application (gitops/argocd/apps/root.yaml).
# Syncs the Helm chart in gitops/projects/operator/ into the cluster
# (namespace operator-system), giving the operator Deployment +
# least-privilege RBAC full GitOps lifecycle management.
# =============================================================
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sentinel-operator
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/yessine15/sentinel.git
    targetRevision: main
    path: gitops/projects/operator
    helm:
      valueFiles:
        - values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: operator-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
