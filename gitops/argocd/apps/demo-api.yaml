# =============================================================
# ArgoCD Application: demo-api
#
# This file lives under gitops/argocd/apps/ so the root Application
# (root.yaml) discovers it and creates this demo-api Application.
# That Application, in turn, syncs the Helm chart in
# gitops/projects/demo-api/ into the cluster.
#
# Once the real Docker image exists (T0.13), ArgoCD will keep the
# Deployment in sync with whatever tag is in values.yaml here.
# =============================================================
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: demo-api
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/yessine15/sentinel.git
    targetRevision: main
    path: gitops/projects/demo-api
    # ArgoCD auto-detects Helm charts (it sees Chart.yaml) and renders
    # them natively. No plugin needed. The valueFiles below point at our
    # own values.yaml inside the chart folder.
    helm:
      valueFiles:
        - values.yaml
  destination:
    server: https://kubernetes.default.svc
    # The chart targets the `sentinel` namespace inside the manifests,
    # so this is just a default. Real target is `sentinel`.
    namespace: sentinel
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
