# =============================================================
# ArgoCD Application: sentinel-frontend
#
# Synced automatically by the root Application (App-of-Apps).
# Points at the Helm chart in gitops/projects/frontend/.
# =============================================================
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sentinel-frontend
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/yessine15/sentinel.git
    targetRevision: main
    path: gitops/projects/frontend
    helm:
      valueFiles:
        - values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: sentinel
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
